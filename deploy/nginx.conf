# Clone de www.theboringblog.ai — servi par nginx dans le conteneur photographer
#
# Comportements de l'origine reproduits ici :
#   1. /route (sans slash final) -> 200 la page elle-meme, sans redirection
#      (try_files teste $uri/index.html AVANT $uri)
#   2. toute URL inconnue -> la vraie page "Not here", statut 404
#   3. polices servies avec un Content-Type correct
#   4. /_next/image?url=X -> sert directement X (l'optimiseur Vercel n'existe pas)
#   5. les scripts d'analytics injectes a l'execution repondent un script vide
#      (aucune requete sortante, aucune erreur console)
#
# Aucune authentification, aucune redirection, aucun backend : des fichiers.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    charset utf-8;
    etag on;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 4. Optimiseur d'images : sert l'image source passee en parametre.
    location = /_next/image {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $arg_url =404;
    }

    # 5. Analytics injecte a l'execution : script vide, pas de 404.
    location ~ "^/[0-9a-f]{10,}/script\.js$" {
        add_header Cache-Control "public, max-age=3600" always;
        return 200 '/* analytics desactive dans ce clone */';
        add_header Content-Type "text/javascript; charset=utf-8";
    }

    # 1. Racine
    location = / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files /index.html @missing;
    }

    # 3. Polices
    location ~* \.(otf|ttf|woff2?)$ {
        types {
            font/otf   otf;
            font/ttf   ttf;
            font/woff  woff;
            font/woff2 woff2;
        }
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @missing;
    }

    # Bundles immuables de Next + assets d'origine : cache long
    location /_next/static/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @missing;
    }

    # Assets de contenu (images, audio)
    location ~* \.(png|jpe?g|webp|avif|gif|svg|ico|mp3|m4a|wav|ogg|mp4|webm)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @missing;
    }


    # Application Vite + React (structure, ilots), servie sous /v2/.
    # Repli SPA : toute route inconnue sous /v2/ rend index.html de l'application.
    # Les assets partages (/_next, /sky, /art, /posts) restent a la racine.
    location /v2/ {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /v2/index.html;
    }

    location /v2/assets/ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri @missing;
    }

    # 2. Pages : /posts sert /posts/index.html, etc.
    location / {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri/index.html $uri $uri.html @missing;
    }

    location @missing { return 404; }

    # La 404 clonee, servie avec le statut 404
    error_page 404 /404-probe-does-not-exist/index.html;
}